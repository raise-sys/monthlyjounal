name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify .NET SDK
        id: verify-dotnet
        continue-on-error: true
        run: dotnet --version

      - name: Install .NET 10 manually
        if: steps.verify-dotnet.outcome == 'failure'
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 10.0
          echo "$HOME/.dotnet" >> $GITHUB_PATH
          dotnet --version

      - name: Install WASM workload
        run: dotnet workload install wasm-tools --skip-manifest-update

      - name: Publish
        run: dotnet publish -c Release -p:BaseHref=/monthlyjounal/
        working-directory: monthlyjounal

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: monthlyjounal/bin/Release/net10.0/publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
